plugins {
    id 'java'
}

group 'purelandgen'
version '1.3-SNAPSHOT'

repositories {
    mavenCentral()
}

apply plugin: 'java'
apply plugin: 'application'

mainClassName = 'purelandgen.PurelandOrigamiEnumerator'

dependencies {
    implementation 'org.xerial:sqlite-jdbc:3.25.+'
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'org.apache.pdfbox:pdfbox:2.0.12'
    testImplementation group: 'junit', name: 'junit', version: '4.+'
}

// encoding
def defaultEncoding = 'UTF-8'
compileJava {
    options.encoding = defaultEncoding
}
compileTestJava {
    options.encoding = defaultEncoding
}

// run configuration
tasks.withType(JavaExec) {
    systemProperty "java.library.path", file("$buildDir/libs")
    jvmArgs '-Xmx6g'
}

task pathAnalysis(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    main = 'purelandgen.analysis.PathGraphAnalyzer'
    args = project.hasProperty('out') ? [project.property('out')] : ['path_graph.csv']
    jvmArgs '-Xmx4g'
}